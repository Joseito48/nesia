<nav class="sticky top-0 z-50 border-b border-nesia-border bg-nesia-dark text-nesia-light">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <div class="flex flex-shrink-0 cursor-pointer items-center" routerLink="/">
        <img src="https://res.cloudinary.com/dye6oqzgy/image/upload/v1785785985/Logo_minimalista_de_NESIA_Detailcar_Group_ddkoty.png" alt="Nesia Detailcar Group" class="h-10 w-auto sm:h-12" />
      </div>

      <div class="hidden md:block">
        <div class="ml-10 flex items-center space-x-4">
          <a routerLink="/" routerLinkActive="text-nesia-blue" [routerLinkActiveOptions]="{exact: true}" class="rounded-md px-3 py-2 text-sm font-semibold transition-colors hover:text-nesia-blue">Inicio</a>
          <a routerLink="/servicios" routerLinkActive="text-nesia-blue" class="rounded-md px-3 py-2 text-sm font-semibold transition-colors hover:text-nesia-blue">Servicios</a>
          <a routerLink="/nosotros" routerLinkActive="text-nesia-blue" class="rounded-md px-3 py-2 text-sm font-semibold transition-colors hover:text-nesia-blue">Nosotros</a>
          <a routerLink="/galeria" routerLinkActive="text-nesia-blue" class="rounded-md px-3 py-2 text-sm font-semibold transition-colors hover:text-nesia-blue">Galería</a>

          <div class="mx-2 h-6 w-px bg-white/15"></div>

          @if (!authService.isAdmin()) {
            <a routerLink="/login" class="flex items-center gap-1 rounded-md px-3 py-2 text-sm font-medium text-white/80 transition-colors hover:text-nesia-blue">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
              Acceso Staff
            </a>
          } @else {
            <div class="flex items-center gap-2">
              <a routerLink="/admin" class="rounded-full border border-white/20 px-4 py-2 text-sm font-semibold uppercase tracking-[0.2em] text-white transition-colors hover:border-nesia-blue hover:text-nesia-blue">Panel Admin</a>
              <button (click)="logout()" class="rounded-full border border-white/20 px-3 py-2 text-sm font-semibold transition-colors hover:border-nesia-blue hover:text-nesia-blue">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
              </button>
            </div>
          }
        </div>
      </div>

      <div class="-mr-2 flex md:hidden">
        <button (click)="toggleMenu()" type="button" class="inline-flex items-center justify-center rounded-md p-2 outline-none transition-colors hover:bg-white/10">
          @if (!menuAbierto()) { <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg> }
          @if (menuAbierto()) { <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg> }
        </button>
      </div>
    </div>
  </div>

  @if (menuAbierto()) {
    <div class="animate-fadeIn border-t border-white/10 bg-nesia-dark md:hidden">
      <div class="space-y-1 px-2 pb-3 pt-2 sm:px-3">
        <a routerLink="/" (click)="closeMenu()" class="block rounded-md px-3 py-2 text-base font-medium text-white/80 transition-colors hover:text-nesia-blue">Inicio</a>
        <a routerLink="/servicios" (click)="closeMenu()" class="block rounded-md px-3 py-2 text-base font-medium text-white/80 transition-colors hover:text-nesia-blue">Servicios</a>
        <a routerLink="/nosotros" (click)="closeMenu()" class="block rounded-md px-3 py-2 text-base font-medium text-white/80 transition-colors hover:text-nesia-blue">Nosotros</a>
        <a routerLink="/galeria" (click)="closeMenu()" class="block rounded-md px-3 py-2 text-base font-medium text-white/80 transition-colors hover:text-nesia-blue">Galería</a>

        <div class="mx-2 my-2 border-t border-white/10"></div>

        @if (!authService.isAdmin()) {
          <a routerLink="/login" (click)="closeMenu()" class="flex items-center gap-2 rounded-md px-3 py-2 text-base font-medium text-white/80 transition-colors hover:text-nesia-blue">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
            Acceso Staff
          </a>
        } @else {
          <p class="mt-2 px-3 text-xs font-bold uppercase tracking-[0.2em] text-white/50">Zona Administración</p>
          <a routerLink="/admin" (click)="closeMenu()" class="block rounded-md px-3 py-2 text-base font-semibold text-nesia-blue">Ir al Panel Admin</a>
          <button (click)="logout()" class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-left text-base font-semibold text-white/80 transition-colors hover:text-nesia-blue">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
            Cerrar Sesión
          </button>
        }
      </div>
    </div>
  }
</nav>

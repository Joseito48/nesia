<div class="min-h-screen bg-nesia-light py-12">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mb-12 text-center">
      <h2 class="text-3xl font-semibold tracking-[-0.02em] text-nesia-dark sm:text-4xl">Galería de Proyectos</h2>
      <p class="mt-4 text-xl text-nesia-muted">Resultados reales. Pasión por el detalle.</p>
    </div>

    <div class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-3">
      @for (item of proyectos; track item.titulo) {
        <div class="group relative cursor-pointer overflow-hidden rounded-[2rem] border border-nesia-border bg-nesia-card shadow-nesia-soft">
          <img [src]="item.img" [alt]="item.titulo" class="h-80 w-full object-cover transition duration-500 ease-in-out group-hover:scale-110">

          <div class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 transition duration-300 group-hover:opacity-100">
            <div class="p-4 text-center">
              <p class="text-lg font-semibold text-white">{{ item.titulo }}</p>
              <span class="mt-2 inline-block rounded-full border border-white/40 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-white">
                {{ item.categoria }}
              </span>
            </div>
          </div>
        </div>
      }
    </div>

    <div class="mt-16 text-center">
      <p class="mb-6 text-nesia-muted">¿Quieres que tu coche luzca así?</p>
      <a routerLink="/servicios" class="btn-outline">
        Ver Servicios y Precios
      </a>
    </div>
  </div>
</div>

<div class="flex min-h-screen items-center justify-center bg-nesia-light px-4 py-12 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-8 rounded-[2rem] border border-nesia-border bg-nesia-card p-10 shadow-nesia-soft">
    <div>
      <h2 class="mt-6 text-center text-3xl font-semibold text-nesia-dark">Acceso Administrativo</h2>
      <p class="mt-2 text-center text-sm text-nesia-muted">Solo personal autorizado de Nesia Detailing</p>
    </div>

    <form class="mt-8 space-y-6" (ngSubmit)="login()">
      <div class="-space-y-px rounded-2xl shadow-sm">
        <div class="mb-4">
          <label for="username" class="sr-only">Usuario</label>
          <input [(ngModel)]="username" name="username" type="text" required class="relative block w-full appearance-none rounded-t-2xl border border-nesia-border px-3 py-3 text-nesia-dark placeholder-nesia-muted focus:z-10 focus:border-nesia-blue focus:outline-none focus:ring-2 focus:ring-nesia-blue sm:text-sm" placeholder="Usuario">
        </div>

        <div>
          <label for="password" class="sr-only">Contraseña</label>
          <input [(ngModel)]="password" name="password" type="password" required class="relative block w-full appearance-none rounded-b-2xl border border-nesia-border px-3 py-3 text-nesia-dark placeholder-nesia-muted focus:z-10 focus:border-nesia-blue focus:outline-none focus:ring-2 focus:ring-nesia-blue sm:text-sm" placeholder="Contraseña">
        </div>
      </div>

      @if (errorMessage) {
        <div class="rounded-2xl border border-red-200 bg-red-50 p-2 text-center text-sm text-red-500">
          {{ errorMessage }}
        </div>
      }

      <div>
        <button type="submit" class="group relative flex w-full justify-center rounded-full border border-nesia-dark px-4 py-3 text-sm font-semibold uppercase tracking-[0.2em] text-nesia-dark transition-colors duration-300 hover:border-nesia-blue hover:text-nesia-blue focus:outline-none focus:ring-2 focus:ring-nesia-blue focus:ring-offset-2">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3">
            <svg class="h-5 w-5 text-nesia-blue" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
            </svg>
          </span>
          Iniciar Sesión
        </button>
      </div>
    </form>

    <div class="mt-4 text-center">
      <a routerLink="/" class="text-sm font-medium text-nesia-dark transition-colors hover:text-nesia-blue">← Volver a la web</a>
    </div>
  </div>
</div>

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
  <div class="w-full max-w-md overflow-hidden rounded-[2rem] border border-nesia-border bg-nesia-card shadow-2xl transition-all">
    <div class="bg-nesia-dark p-6 text-white">
      <h2 class="text-2xl font-semibold">Reservar Cita</h2>
      <p class="mt-1 text-sm text-white/70">Servicio: <span class="font-semibold text-nesia-blue">{{ servicio?.title }}</span></p>
    </div>

    <form [formGroup]="reservaForm" (ngSubmit)="onSubmit()" class="space-y-4 p-6">
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Tu Nombre</label>
        <input formControlName="nombreCliente" type="text" class="w-full rounded-xl border border-nesia-border px-4 py-2 text-gray-900 focus:border-nesia-blue focus:outline-none focus:ring-2 focus:ring-nesia-blue/20" placeholder="Juan Pérez">
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Email</label>
        <input formControlName="email" type="email" class="w-full rounded-xl border border-nesia-border px-4 py-2 text-gray-900 focus:border-nesia-blue focus:outline-none focus:ring-2 focus:ring-nesia-blue/20" placeholder="juan@ejemplo.com">
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Teléfono</label>
        <input formControlName="telefono" type="tel" class="w-full rounded-xl border border-nesia-border px-4 py-2 text-gray-900 focus:border-nesia-blue focus:outline-none focus:ring-2 focus:ring-nesia-blue/20" placeholder="600 000 000">
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">Fecha Preferida</label>
        <input formControlName="fecha" type="date" class="w-full rounded-xl border border-nesia-border px-4 py-2 text-gray-900 focus:border-nesia-blue focus:outline-none focus:ring-2 focus:ring-nesia-blue/20">
      </div>

      <div class="mb-4">
        <label class="mb-1 block text-sm font-medium text-gray-700">Servicio deseado</label>

        @if (servicio) {
          <div class="w-full rounded-xl border border-nesia-border bg-nesia-light px-4 py-2 font-semibold text-gray-700">
            {{ servicio.title }}
          </div>
        } @else {
          <select formControlName="servicioId" class="w-full rounded-xl border border-nesia-border px-4 py-2 text-gray-900 focus:border-nesia-blue focus:outline-none focus:ring-2 focus:ring-nesia-blue/20">
            <option value="" disabled selected>Selecciona un servicio...</option>
            @for (s of listaServicios(); track s._id) {
              <option [value]="s._id">{{ s.title }} - {{ s.price }}€</option>
            }
          </select>
        }
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button type="button" (click)="cerrar()" class="rounded-full border border-nesia-dark px-4 py-2 text-sm font-semibold uppercase tracking-[0.2em] text-nesia-dark transition-colors hover:border-nesia-blue hover:text-nesia-blue">
          Cancelar
        </button>
        <button type="submit" class="rounded-full border border-nesia-dark px-6 py-2 text-sm font-semibold uppercase tracking-[0.2em] text-nesia-dark transition-colors hover:border-nesia-blue hover:text-nesia-blue disabled:cursor-not-allowed disabled:opacity-60">
          Confirmar Reserva
        </button>
      </div>
    </form>
  </div>
</div>
